[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-agent"
version = "0.1.0"
description = "Evidence-based Android game test tools and upgrade assertions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-test-agent = "ai_test_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
